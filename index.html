<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #fff;
      color: #111;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: #555;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    #close-note {
      margin-top: 1.25rem;
      color: #999;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>الصفحة غير متاحة</p>
  <p>Page not available</p>
  <p id="close-note">ستُغلق خلال <span id="secs">5</span> ثوانٍ</p>
  <script>
    (function () {
      var left = 5;
      var el = document.getElementById("secs");
      var tick = setInterval(function () {
        left -= 1;
        if (el) el.textContent = String(left);
        if (left <= 0) {
          clearInterval(tick);
          window.close();
          window.location.replace("about:blank");
        }
      }, 1000);
    })();
  </script>
</body>
</html>
